<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ReliefLink · Coordinator Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #0b1220; --panel: #121a2b; --panel2: #1a2438; --text: #e6ecf5; --muted: #8b98ad;
    --line: #26324a; --accent: #3b82f6;
    --CRITICAL: #ef4444; --HIGH: #f97316; --MEDIUM: #eab308; --LOW: #22c55e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           padding: 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; } h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 12px; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer;
           background: var(--panel2); color: var(--text); }
  button.primary { background: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .layout { display: grid; grid-template-columns: 400px 1fr; height: calc(100vh - 58px); }
  aside { overflow-y: auto; border-right: 1px solid var(--line); padding: 14px; }
  #map { height: 100%; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--panel); border-radius: 10px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 20px; }
  .stat small { color: var(--muted); font-size: 11px; }
  .stat.crit b { color: var(--CRITICAL); }
  section { background: var(--panel); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  textarea, input { width: 100%; font: inherit; background: var(--panel2); color: var(--text);
                    border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  textarea { resize: vertical; min-height: 64px; }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .preview { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 16px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #111; }
  .req { border-left: 4px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 9px 10px; margin-bottom: 8px; cursor: pointer; }
  .req:hover { outline: 1px solid var(--line); }
  .req .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12px; }
  .req p { margin: 6px 0; font-size: 13px; line-height: 1.35; }
  .req .why { font-size: 11px; color: var(--muted); }
  .req .meta { font-size: 11px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .req.assigned { opacity: .75; } .req.resolved { opacity: .4; }
  .review { background: #7c3aed; color: #fff; }
  .reviewbox { display: flex; gap: 6px; margin-top: 6px; }
  .reviewbox select { font: inherit; font-size: 12px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; }
  .compare { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 4px 8px; font-size: 12px; }
  .compare .h { color: var(--muted); } .compare .win { color: var(--LOW); font-weight: 700; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .filters button { padding: 4px 10px; font-size: 12px; }
  .filters button.on { background: var(--accent); color: #fff; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel2);
           border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; display: none; z-index: 1000; }
  .legend { background: var(--panel); color: var(--text); padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.7; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 50vh auto; height: auto; }
    #map { height: 50vh; grid-row: 1; } aside { grid-row: 2; border-right: 0; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Relief<span>Link</span></h1>
    <div class="sub">AI-assisted disaster relief coordination</div>
  </div>
  <div class="row" style="margin:0">
    <button id="seedBtn">Load demo scenario</button>
    <button id="dispatchBtn" class="primary">Dispatch volunteers</button>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="stats">
      <div class="stat crit"><b id="sCrit">0</b><small>critical open</small></div>
      <div class="stat"><b id="sOpen">0</b><small>open</small></div>
      <div class="stat"><b id="sPeople">0</b><small>people waiting</small></div>
      <div class="stat"><b id="sDup">0</b><small>duplicates merged</small></div>
    </div>
    <div class="sub" id="reviewNote" style="margin:-6px 0 12px"></div>

    <section>
      <h2>New help request</h2>
      <textarea id="text" placeholder="Paste a message in English, हिंदी or தமிழ்... e.g. 'trapped on roof, water rising, 4 people'"></textarea>
      <div class="preview" id="preview"></div>
      <div class="row">
        <input id="loc" placeholder="Click the map to set location" readonly />
        <button class="primary" id="submitBtn" disabled>Submit</button>
      </div>
    </section>

    <section>
      <h2>Dispatch strategy comparison (open requests)</h2>
      <div class="compare" id="compare"><span class="sub">Load the demo to compare.</span></div>
    </section>

    <section>
      <h2>Requests by priority</h2>
      <div class="filters" id="filters">
        <button data-f="open" class="on">Open</button>
        <button data-f="assigned">Assigned</button>
        <button data-f="resolved">Resolved</button>
        <button data-f="all">All</button>
      </div>
      <div id="list"></div>
    </section>
  </aside>
  <div id="map"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const COLORS = { CRITICAL: "#ef4444", HIGH: "#f97316", MEDIUM: "#eab308", LOW: "#22c55e" };
const ICONS = { rescue: "🛟", medical: "🩺", water: "💧", food: "🍚", shelter: "🏠", other: "❗" };
let filter = "open", pickedLoc = null, requests = [];

const map = L.map("map").setView([13.0, 80.21], 11);
L.tileLayer("https://{s}.basemap.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  attribution: "&copy; OpenStreetMap &copy; CARTO", maxZoom: 19,
}).addTo(map);
const layers = { req: L.layerGroup().addTo(map), vol: L.layerGroup().addTo(map), lines: L.layerGroup().addTo(map), pick: L.layerGroup().addTo(map) };
const markers = {};

const legend = L.control({ position: "bottomright" });
legend.onAdd = () => {
  const d = L.DomUtil.create("div", "legend");
  d.innerHTML = Object.entries(COLORS).map(([k, c]) => `<span class="dot" style="background:${c}"></span>${k}`).join("<br>")
    + '<br><span class="dot" style="background:#3b82f6;border-radius:2px"></span>Volunteer';
  return d;
};
legend.addTo(map);

function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3500); }
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail ? JSON.stringify(j.detail) : r.statusText);
  return j;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function ago(iso) { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`; }

function renderList() {
  const list = $("list"); list.innerHTML = "";
  const shown = requests.filter((r) => filter === "all" || r.status === filter);
  if (!shown.length) list.append(el("div", "sub", "Nothing here."));
  for (const r of shown) {
    const card = el("div", `req ${r.status}`); card.style.borderLeftColor = COLORS[r.effective_level];
    const top = el("div", "top");
    const b = el("span", "badge", `${r.effective_level} · ${r.effective_urgency}`); b.style.background = COLORS[r.effective_level];
    top.append(b, el("span", "sub", `${ICONS[r.category] || ""} ${r.needs.join(", ")} · #${r.id}`));
    if (r.needs_review) top.prepend(el("span", "badge review", "REVIEW"));
    const why = el("div", "why", r.reasons.join(" · "));
    const meta = el("div", "meta");
    meta.append(el("span", null, `👥 ${r.people}`), el("span", null, `📨 ${r.report_count} report${r.report_count > 1 ? "s" : ""}`),
                el("span", null, `🕒 ${ago(r.created_at)}`), el("span", null, r.source), el("span", null, r.status));
    card.append(top, el("p", null, r.text), why, meta);
    if (r.needs_review && r.status !== "resolved") {
      // Human-in-the-loop: the coordinator confirms or corrects the AI's guess.
      const box = el("div", "reviewbox");
      const sel = el("select");
      for (const c of ["rescue", "medical", "water", "food", "shelter", "other"]) {
        const o = el("option", null, c); o.value = c; o.selected = c === r.category; sel.append(o);
      }
      const urg = el("select");
      for (const [label, v] of [["LOW", 20], ["MEDIUM", 40], ["HIGH", 60], ["CRITICAL", 85]]) {
        const o = el("option", null, label); o.value = v; o.selected = label === r.level; urg.append(o);
      }
      const ok = el("button", null, "Confirm"); ok.style.cssText = "padding:3px 10px;font-size:12px";
      [sel, urg, ok].forEach((x) => x.onclick = (e) => e.stopPropagation());
      ok.onclick = async (e) => {
        e.stopPropagation();
        await api(`/api/requests/${r.id}/review?category=${sel.value}&urgency=${urg.value}`, { method: "POST" });
        toast(`Request #${r.id} reviewed`); refresh();
      };
      box.append(sel, urg, ok); card.append(box);
    }
    if (r.status !== "resolved") {
      const btn = el("button", null, "Mark resolved"); btn.style.cssText = "margin-top:6px;padding:4px 10px;font-size:12px";
      btn.onclick = async (e) => { e.stopPropagation(); await api(`/api/requests/${r.id}/resolve`, { method: "POST" }); refresh(); };
      card.append(btn);
    }
    card.onclick = () => { map.setView([r.lat, r.lon], 15); markers[r.id]?.openPopup(); };
    list.append(card);
  }
}

function renderMap(vols, assigns) {
  layers.req.clearLayers(); layers.vol.clearLayers(); layers.lines.clearLayers();
  for (const r of requests) {
    if (r.status === "resolved") continue;
    const m = L.circleMarker([r.lat, r.lon], {
      radius: 6 + Math.min(10, Math.sqrt(r.people) * 2), color: COLORS[r.effective_level],
      fillColor: COLORS[r.effective_level], fillOpacity: r.status === "open" ? 0.85 : 0.35, weight: 2,
    });
    const pop = el("div"); pop.append(el("b", null, `#${r.id} ${r.effective_level} (${r.effective_urgency})`), el("br"), el("span", null, r.text));
    m.bindPopup(pop); m.addTo(layers.req); markers[r.id] = m;
  }
  for (const v of vols) {
    const icon = L.divIcon({ className: "", html: '<div style="width:14px;height:14px;background:#3b82f6;border:2px solid #fff;border-radius:3px"></div>', iconSize: [14, 14] });
    L.marker([v.lat, v.lon], { icon }).bindPopup(`${v.name.replace(/</g, "&lt;")}<br>${v.skills.join(", ")} · ${v.active_tasks}/${v.capacity} busy`).addTo(layers.vol);
  }
  for (const a of assigns) {
    L.polyline([[a.v_lat, a.v_lon], [a.r_lat, a.r_lon]], { color: COLORS[a.level], weight: 2, dashArray: "6 6", opacity: 0.9 })
      .bindTooltip(`${a.volunteer_name} → #${a.request_id} · ${a.distance_km} km · ETA ${a.eta_min} min`).addTo(layers.lines);
  }
}

function renderCompare(c) {
  const box = $("compare"); box.innerHTML = "";
  const rows = [["Requests served", "requests_served", 1], ["Critical served", "critical_served", 1],
                ["Urgency served", "urgency_served", 1], ["Total travel (km)", "total_km", -1], ["Avg ETA (min)", "avg_eta_min", -1]];
  box.append(el("span", "h", ""), el("span", "h", "Optimal"), el("span", "h", "First-come"));
  for (const [label, key, better] of rows) {
    const o = c.optimal[key], g = c.greedy[key];
    const oWin = better > 0 ? o > g : o < g, gWin = better > 0 ? g > o : g < o;
    box.append(el("span", null, label), el("span", oWin ? "win" : "", key === "critical_served" ? `${o}/${c.optimal.critical_total}` : o),
               el("span", gWin ? "win" : "", key === "critical_served" ? `${g}/${c.greedy.critical_total}` : g));
  }
}

async function refresh() {
  try {
    const [reqs, stats, vols, assigns, cmp] = await Promise.all([
      api("/api/requests"), api("/api/stats"), api("/api/volunteers"), api("/api/assignments"), api("/api/dispatch/compare")]);
    requests = reqs;
    $("sCrit").textContent = stats.critical_open; $("sOpen").textContent = stats.open;
    $("sPeople").textContent = stats.people_waiting; $("sDup").textContent = stats.duplicates_merged;
    $("reviewNote").textContent = stats.needs_review ? `${stats.needs_review} request(s) need human review, marked REVIEW below` : "";
    renderList(); renderMap(vols, assigns);
    if (stats.open && vols.length) renderCompare(cmp);
  } catch (e) { console.error(e); }
}

$("filters").onclick = (e) => {
  if (!e.target.dataset.f) return;
  filter = e.target.dataset.f;
  [...$("filters").children].forEach((b) => b.classList.toggle("on", b === e.target));
  renderList();
};

map.on("click", (e) => {
  pickedLoc = e.latlng; layers.pick.clearLayers();
  L.marker(e.latlng).addTo(layers.pick);
  $("loc").value = `${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;
  $("submitBtn").disabled = !$("text").value.trim();
});

let previewTimer;
$("text").addEventListener("input", () => {
  $("submitBtn").disabled = !($("text").value.trim() && pickedLoc);
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    const text = $("text").value.trim();
    if (text.length < 3) return ($("preview").textContent = "");
    const t = await api("/api/triage", { method: "POST", body: JSON.stringify({ text }) });
    $("preview").textContent = `Live triage → ${t.level} (${t.urgency}) · ${t.needs.join(", ")} · ${t.people} people${t.reasons.length ? " · " + t.reasons.join(" · ") : ""}`;
  }, 350);
});

$("submitBtn").onclick = async () => {
  try {
    const res = await api("/api/requests", { method: "POST", body: JSON.stringify({ text: $("text").value, lat: pickedLoc.lat, lon: pickedLoc.lng }) });
    toast(res.duplicate_of ? `Merged into existing incident #${res.duplicate_of}` : `Request #${res.request.id} created: ${res.request.level}`);
    $("text").value = ""; $("preview").textContent = ""; $("loc").value = ""; pickedLoc = null;
    layers.pick.clearLayers(); $("submitBtn").disabled = true; refresh();
  } catch (e) { toast("Error: " + e.message); }
};

$("seedBtn").onclick = async () => {
  if (!confirm("This resets all data and loads the Chennai flood demo. Continue?")) return;
  const r = await api("/api/demo/seed", { method: "POST" });
  toast(`Loaded ${r.requests} messages → ${r.duplicates_merged} duplicates merged, ${r.volunteers} volunteers`);
  map.setView([13.0, 80.21], 11); refresh();
};

$("dispatchBtn").onclick = async () => {
  const r = await api("/api/dispatch?strategy=optimal", { method: "POST" });
  toast(r.assigned ? `Dispatched ${r.assigned} volunteers · avg ETA ${r.summary.avg_eta_min} min` : "No feasible assignments (no free volunteers or open requests).");
  refresh();
};

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
