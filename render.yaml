services:
  - type: web
    name: relieflink
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RELIEFLINK_DB
        value: /tmp/relieflink.db
